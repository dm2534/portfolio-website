server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (Vite fingerprints JS/CSS/Images)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Standard SPA routing: redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Do not cache index.html to ensure users always get the latest version
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}